# kind maps containerPort 30080 to hostPort 8080 (kind/kind-config.yaml), so the
# OpenAI-compatible surface is reachable at http://localhost:8080/v1.
apiVersion: v1
kind: Service
metadata:
  name: opensre-gateway
  namespace: opensre
spec:
  type: NodePort
  ports:
    - name: openai-compat
      port: 8765
      targetPort: 8765
      nodePort: 30080
    - name: health
      port: 8000
      targetPort: 8000
