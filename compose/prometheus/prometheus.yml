global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # kube-state-metrics runs inside the kind cluster and is exposed on NodePort
  # 30081. "opensre-control-plane" is the kind node's container name, resolved by
  # Docker's DNS on the shared "kind" network.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['opensre-control-plane:30081']
